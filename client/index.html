<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>KeyCraft AI — конструктор клавиатур</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Перейти к содержимому</a>
  <header class="topbar">
    <a class="brand" href="#catalog"><span class="brand-mark" aria-hidden="true">K</span>KeyCraft<span class="brand-ai">AI</span></a>
    <nav id="navigation" aria-label="Основная навигация"></nav>
    <div id="account"></div>
  </header>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
  <main id="main" tabindex="-1"><p class="loading">Загрузка каталога…</p></main>
  <footer><span>KeyCraft AI · Конструктор механических клавиатур</span><span>Курсовой проект · 2026</span></footer>
  <dialog id="detail-dialog" aria-labelledby="detail-title"><button class="close" data-action="close-detail" aria-label="Закрыть карточку">×</button><div id="detail-content"></div></dialog>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title">
    <h2 id="confirm-title">Подтвердите удаление</h2><p id="confirm-message"></p>
    <form method="dialog" class="actions"><button value="cancel" class="secondary">Отмена</button><button value="confirm" class="danger">Удалить</button></form>
  </dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
